services:
  app:
    image: python:3.12-slim
    working_dir: /app
    command: sh -c "pip install django gunicorn dj-database-url psycopg2-binary && python manage.py migrate --noinput && gunicorn myapp.wsgi:application --bind 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=${DEBUG:-0}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL}
